*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0918;overflow:hidden}
body{font-synthesis:none;display:flex;align-items:center;justify-content:center;font-family:var(--ui);color:var(--paper);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.app{--cw:min(26vw,14.2vh,112px);--ow:min(19vw,10.6vh,84px);
  position:relative;width:min(100vw,430px);height:100dvh;max-height:932px;overflow:hidden;display:flex;flex-direction:column;background:var(--night);isolation:isolate}
.app.m5{--cw:min(25vw,12.8vh,108px);--ow:min(10.6vw,6.2vh,46px)}
@media (min-width:500px){.app{border-radius:28px;height:min(100dvh - 32px,900px);border:4px solid var(--ink);box-shadow:0 0 0 2px #2c2348,0 30px 80px rgba(0,0,0,.6)}}
#bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-2}
.crt{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),
             radial-gradient(130% 90% at 50% 50%,transparent 55%,rgba(5,3,12,.75) 100%)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 4px}
.top-r{display:flex;gap:6px}
.title{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:0}
.t1{font-family:var(--cn);font-size:28px;color:var(--amber);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);letter-spacing:2px}
.t2{font-family:var(--cn);font-size:12px;color:#b9aee0;margin-top:5px;white-space:nowrap}
.chip-btn{font-family:var(--cn);font-size:15px;padding:7px 10px;background:var(--plum);border:3px solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip-btn[aria-pressed="true"]{background:var(--teal);color:var(--ink)}

/* seats */
.seat{position:relative;display:flex;align-items:center;gap:10px;width:100%}
.avatar{width:50px;height:50px;flex:none;background:var(--plum-d);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.avatar svg{width:36px;height:36px}
.turn .avatar{animation:think 1s steps(2) infinite}
@keyframes think{50%{border-color:var(--amber)}}
.who{min-width:0}
.who .name{font-family:var(--cn);font-size:19px;line-height:1.1;white-space:nowrap}
.sty{font-style:normal;font-size:12px;margin-left:6px;padding:2px 5px 1px;border:2px solid var(--ink);border-radius:5px;background:var(--plum-d);color:#cfc6f0;vertical-align:3px}
.app.m5 .oseat .sty{font-size:10px;margin-left:4px;padding:1px 3px 0;vertical-align:2px}
.stack{display:flex;align-items:center;gap:6px;font-family:var(--px);font-weight:400;font-size:13px;color:var(--amber)}
.stack.big{font-size:17px}
.coin{width:14px;height:14px;flex:none;background:var(--amber);border:2px solid var(--ink);border-radius:50%;box-shadow:inset -2px -2px 0 var(--amber-d)}
.stack.big .coin{width:18px;height:18px}
.badges{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.badge{font-family:var(--cn);font-size:13px;padding:3px 7px 2px;border:2px solid var(--ink);border-radius:6px;background:var(--plum);box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.badge.blind{background:var(--violet);color:#fff}
.badge.bao{background:var(--amber);color:var(--ink)}
.badge.fold{background:var(--rose);color:#fff}
.badge.first{background:var(--teal);color:var(--ink)}
.badge.dealer{background:var(--paper);color:var(--ink)}

.bubble{position:absolute;z-index:12;font-family:var(--cn);font-size:17px;padding:6px 12px 5px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.4);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .15s;white-space:nowrap}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.teal{background:var(--teal)} .bubble.amber{background:var(--amber)} .bubble.rose{background:var(--rose);color:#fff} .bubble.violet{background:var(--violet);color:#fff}

/* opponents */
.opps{display:flex;justify-content:center;padding:6px 14px 0}
.oseat{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.oseat .bubble{left:136px;top:2px}
.oseat .hname{position:absolute;bottom:-36px;z-index:5}
.oseat .seal{right:18px;bottom:8px}

.app.m5 .opps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 10px 0}
.app.m5 .oseat{gap:6px;padding:6px 7px 8px;background:rgba(20,15,34,.5);border:3px solid var(--ink);border-radius:12px;align-items:stretch}
.app.m5 .oseat.turn{border-color:var(--amber)}
.app.m5 .oseat.folded{opacity:.6}
.app.m5 .oseat .seat{gap:6px;align-items:flex-start}
.app.m5 .oseat .avatar{width:32px;height:32px;border-width:2px;border-radius:7px;box-shadow:0 2px 0 var(--ink)}
.app.m5 .oseat .avatar svg{width:22px;height:22px}
.app.m5 .oseat .name{font-size:14px}
.app.m5 .oseat .stack{font-size:10px;gap:4px}
.app.m5 .oseat .coin{width:10px;height:10px;border-width:2px;box-shadow:none}
.app.m5 .oseat .badges{gap:3px;max-width:60px}
.app.m5 .oseat .badge{font-size:11px;padding:2px 4px 1px;box-shadow:none}
.app.m5 .oseat .cards{gap:5px}
.app.m5 .oseat .bubble{left:auto;right:-2px;top:-12px;font-size:14px;padding:4px 8px 3px}
.app.m5 .oseat .hname{left:0;right:0;margin:auto;width:max-content;bottom:-10px;font-size:13px;padding:2px 7px 1px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.app.m5 .oseat .seal{display:none}
.app.m5 .oseat .wob{animation:none}
.app.m5 .oseat .card::after{display:none}
.app.m5 .oseat .face{border-width:2px;border-radius:6px}
.app.m5 .oseat .back{box-shadow:inset 0 0 0 2px var(--violet)}

/* cards */
.cards{display:flex;gap:10px;justify-content:center;position:relative}
.card{--w:var(--cw);position:relative;width:var(--w);aspect-ratio:5/7;perspective:700px;transition:transform .22s cubic-bezier(.2,1.5,.4,1),filter .3s}
.oseat .card{--w:var(--ow)}
.wob{position:absolute;inset:0;animation:wob 3.2s ease-in-out infinite;animation-delay:var(--wd,0s)}
@keyframes wob{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-2px)}}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.card.down .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:9px;overflow:hidden}
.card::after{content:"";position:absolute;left:4px;right:4px;bottom:-6px;height:8px;background:rgba(10,6,22,.55);border-radius:50%;z-index:-1;filter:blur(1px)}
.front{background:var(--paper);box-shadow:inset 0 0 0 2px #fffaf0,inset 0 -5px 0 var(--paper-d)}
.front.r{color:var(--suit-r)} .front.k{color:var(--suit-b)}
.front .idx{position:absolute;left:5%;top:3%;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.front .idx b{font-family:var(--px);font-weight:400;font-size:calc(var(--w) * .17);letter-spacing:-.06em}
.front .idx svg{width:calc(var(--w) * .15)}
.front .idx.br{left:auto;top:auto;right:5%;bottom:5%;transform:rotate(180deg)}
.front .mid{position:absolute;inset:0;display:grid;place-items:center}
.front .mid svg{width:calc(var(--w) * .42)}
.front .mid b{font-family:var(--px);font-weight:400;font-size:calc(var(--w) * .38);line-height:1;text-shadow:0 3px 0 rgba(20,15,34,.18)}
.front .mc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.front .mc b{font-family:var(--px);font-weight:400;font-size:calc(var(--w) * .3);letter-spacing:-.08em;line-height:1}
.front .mc svg{width:calc(var(--w) * .34)}
.back{transform:rotateY(180deg);background-color:var(--violet-d);
  background-image:conic-gradient(#6a4bd2 25%,transparent 0 50%,#6a4bd2 0 75%,transparent 0);background-size:8px 8px;
  box-shadow:inset 0 0 0 3px var(--violet),inset 0 0 0 5px var(--ink)}
.back .emb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;aspect-ratio:4/3;background:var(--ink);border-radius:18%;display:grid;place-items:center;box-shadow:0 0 0 3px var(--amber)}
.back .emb svg{width:72%}
.app.m5 .oseat .back .emb{box-shadow:0 0 0 2px var(--amber)}

.tag{position:absolute;top:-9px;right:-7px;z-index:3;font-family:var(--cn);font-size:12px;line-height:1;padding:4px 6px 3px;border:2px solid var(--ink);border-radius:6px;box-shadow:0 2px 0 var(--ink);opacity:0;transform:scale(.5);transition:.2s cubic-bezier(.2,1.6,.4,1)}
.tag.on{opacity:1;transform:scale(1)}
.tag.ming{background:var(--amber);color:var(--ink)}
.tag.an{background:var(--plum-d);color:#cfc6f0}
.card.pickable{cursor:pointer}
.card.pickable::before{content:"";position:absolute;inset:-6px;border:3px dashed rgba(255,182,39,.7);border-radius:12px;animation:dash 1s steps(2) infinite}
@keyframes dash{50%{border-color:rgba(255,182,39,.25)}}
.card.picked{transform:translateY(-16px)}
.card.picked::before{border-style:solid;border-color:var(--amber);animation:none}
.card.win .face{box-shadow:0 0 0 3px var(--amber),0 0 22px rgba(255,182,39,.6)}
.card.lose{filter:saturate(.35) brightness(.7)}
.folded .card{filter:grayscale(.8) brightness(.55)}

.hname{font-family:var(--cn);font-size:17px;padding:3px 12px 2px;border:3px solid var(--ink);border-radius:8px;background:var(--plum);box-shadow:0 3px 0 var(--ink);opacity:0;transform:scale(.6);transition:.25s cubic-bezier(.2,1.6,.4,1);white-space:nowrap;pointer-events:none}
.hname.on{opacity:1;transform:scale(1)}
.hname.win{background:var(--amber);color:var(--ink)}
.seal{position:absolute;z-index:6;font-family:var(--cn);font-size:20px;padding:6px 12px 4px;background:var(--amber);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);transform:rotate(-10deg) scale(2.2);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .12s}
.seal.on{opacity:1;transform:rotate(-10deg) scale(1)}

/* table */
.table{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 14px}
.steps{list-style:none;display:flex;justify-content:space-between;width:100%;max-width:380px;position:relative}
.steps::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:3px;background:var(--ink)}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--cn);font-size:12px;color:#7d71a8;flex:1}
.steps li i{width:15px;height:15px;background:var(--plum-d);border:3px solid var(--ink);border-radius:4px}
.steps li.done{color:#b9aee0} .steps li.done i{background:var(--violet)}
.steps li.cur{color:var(--amber)} .steps li.cur i{background:var(--amber);transform:scale(1.25)}
.pot{display:flex;flex-direction:column;align-items:center;min-width:110px;padding:8px 26px 10px;background:var(--plum-d);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink),inset 0 0 0 2px #463572}
.pot-l{font-family:var(--cn);font-size:14px;color:#b9aee0}
.pot-v{font-family:var(--px);font-weight:400;font-size:26px;margin-top:4px;color:var(--amber);line-height:1.05;text-shadow:0 3px 0 var(--ink)}
.eff{font-family:var(--cn);font-size:13px;color:#b9aee0;margin-top:3px;min-height:16px;white-space:nowrap}
.msg{font-family:var(--cn);font-size:16px;line-height:1.35;text-align:center;max-width:330px;min-height:44px;color:#e9e3ff;text-shadow:0 2px 0 var(--ink)}

/* me */
.zone.me{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px}
.zone.me .hname{display:none}
.hint.won{color:var(--ink);background:var(--amber);border:2px solid var(--ink);border-radius:6px;padding:2px 8px 1px}
.zone.me .seal{left:50%;right:auto;top:auto;bottom:50px;margin-left:-46px}
.zone.me .bubble{left:0;right:auto;bottom:44px}
.me-seat{gap:10px;margin-top:4px}
.hint{font-family:var(--cn);font-size:14px;color:#cfc6f0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.eqpill{font-family:var(--px);font-weight:400;font-size:10px;padding:2px 7px;background:var(--teal);color:var(--ink);border:2px solid var(--ink);border-radius:6px}

/* actions */
.actions{position:relative;display:flex;gap:8px;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);min-height:86px;align-items:stretch}
.actions.mine::before{content:"";position:absolute;left:8px;right:8px;top:2px;height:4px;border-radius:2px;background:var(--amber);box-shadow:0 0 14px 2px rgba(255,182,39,.7);animation:mine 1.1s ease-in-out infinite}
@keyframes mine{50%{opacity:.35}}
/* 牌桌垫 + 筹码堆 */
.mat{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;max-width:340px;padding:12px 14px;border:3px solid var(--ink);border-radius:30px;
  background-color:#2a1f47;background-image:conic-gradient(#30245280 25%,transparent 0 50%,#30245280 0 75%,transparent 0);background-size:6px 6px;box-shadow:0 5px 0 var(--ink),inset 0 0 0 2px #463572}
.mat::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,182,39,.28);border-radius:22px;pointer-events:none}
.mat .pot{box-shadow:0 4px 0 var(--ink),inset 0 0 0 2px #463572;padding:6px 20px 8px}
.pile{display:flex;align-items:flex-end;gap:3px;width:56px;height:58px;justify-content:center}
.pile .col{display:flex;flex-direction:column-reverse}
.pile i{display:block;width:20px;height:7px;margin-top:-2px;border:2px solid var(--ink);border-radius:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pile i.a{background:var(--amber)} .pile i.t{background:var(--teal)} .pile i.r{background:var(--rose)} .pile i.v{background:var(--violet)}
.pile i.new{animation:chipin .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes chipin{from{transform:translateY(-14px);opacity:0}}
/* 特效层 */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:17;pointer-events:none;image-rendering:pixelated}
.flashlayer{position:absolute;inset:0;z-index:18;pointer-events:none;background:#fff;opacity:0}
.banner .bx{display:flex;flex-direction:column;align-items:center;padding:14px 34px 16px;background:var(--plum);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink),inset 0 0 0 3px #4b3a78}
.banner.lose .bx{background:var(--plum-d)}
.banner.big .bx{background:var(--ink);box-shadow:0 6px 0 #000,inset 0 0 0 3px var(--amber)}
.banner{position:absolute;left:0;right:0;top:36%;z-index:19;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
.banner b{font-family:var(--cn);font-weight:400;font-size:54px;line-height:1;color:var(--amber);text-shadow:0 5px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.banner span{font-family:var(--px);font-size:22px;margin-top:10px;color:var(--paper);text-shadow:0 3px 0 var(--ink)}
.banner.lose b{color:var(--rose);font-size:40px}
.banner.big b{font-size:72px;color:#ffe08a;text-shadow:0 6px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),0 0 24px rgba(255,122,61,.9)}
.card.flash .front{animation:cflash .5s ease-out}
@keyframes cflash{0%{filter:brightness(2.2)}100%{filter:none}}
.card.win .front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 47%,transparent 58%);transform:translateX(-130%);animation:shine 1.1s .25s ease-out 2}
@keyframes shine{to{transform:translateX(130%)}}
.snd svg{width:18px;height:18px;display:block}
.chip-btn.snd{padding:6px 8px}
@media (max-width:360px){.chip-btn{padding:6px 7px;font-size:14px}.t1{font-size:24px}}
.btn{flex:1;min-width:0;font-family:var(--cn);font-size:19px;line-height:1;color:#fff;padding:14px 4px 12px;border:3px solid var(--ink);border-radius:11px;box-shadow:0 5px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.22);text-shadow:0 2px 0 rgba(20,15,34,.45);transition:transform .06s,box-shadow .06s,filter .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -2px 0 rgba(0,0,0,.22)}
.btn:disabled{filter:saturate(.15) brightness(.55);cursor:default}
.btn.teal{background:var(--teal)} .btn.amber{background:var(--amber);color:var(--ink);text-shadow:none}
.btn.rose{background:var(--rose)} .btn.violet{background:var(--violet)} .btn.plum{background:var(--plum)}
.btn small{display:block;font-size:12px;margin-top:4px;opacity:.85}
.btn.wide{flex:1.3}
.wait{flex:1;display:grid;place-items:center;font-family:var(--cn);font-size:16px;color:#b9aee0;text-align:center}
.res{flex:1.4;display:flex;flex-direction:column;justify-content:center;padding:0 6px;min-width:0}
.res b{font-family:var(--px);font-weight:400;font-size:20px;line-height:1}
.res span{font-family:var(--cn);font-size:14px;color:#cfc6f0;margin-top:4px}
.res.win b{color:var(--amber)} .res.lose b{color:var(--rose)}

/* sheet & modals */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(10,6,22,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:21;background:var(--plum);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:14px;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
.sheet.on{transform:none}
.sheet h3{font-family:var(--cn);font-weight:400;font-size:20px;margin-bottom:4px}
.sheet p{font-size:13px;color:#cfc6f0;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:10px}
.opt{font-family:var(--cn);background:var(--amber);color:var(--ink);border:3px solid var(--ink);border-radius:11px;box-shadow:0 5px 0 var(--ink);padding:10px 4px}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt .k{font-size:15px}
.opt .x{font-family:var(--px);font-weight:400;font-size:16px;margin:6px 0 4px}
.opt .c{font-size:12px;opacity:.8}
.modal{position:absolute;inset:0;z-index:25;display:grid;place-items:center;padding:18px;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(10,6,22,.5)}
.modal.on{opacity:1;pointer-events:auto}
.mbox{width:100%;max-height:86%;overflow:auto;background:var(--plum);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:18px 18px 16px;transform:scale(.9);transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.modal.on .mbox{transform:none}
.mbox h2{font-family:var(--cn);font-weight:400;font-size:26px;color:var(--amber);text-shadow:0 3px 0 var(--ink);margin-bottom:10px}
.mbox ol{padding-left:22px;font-size:14px;line-height:1.6;color:#e9e3ff}
.mbox ol li{margin-bottom:4px}
.mbox ol b{font-family:var(--cn);font-weight:400;color:var(--amber);font-size:16px}
.mbox p{font-size:14px;line-height:1.6;color:#e9e3ff;margin-top:10px}
.mbox .rank{font-family:var(--cn);font-size:16px;color:var(--teal);margin-top:10px;line-height:1.5}
.mbox .row2{display:flex;gap:8px;margin-top:16px}

/* lobby */
.lobby{position:absolute;inset:0;z-index:24;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px);background:rgba(16,11,32,.95);opacity:0;pointer-events:none;transition:opacity .25s;overflow:auto}
.lobby.on{opacity:1;pointer-events:auto}
.lb-title{font-family:var(--cn);font-size:56px;line-height:1;color:var(--amber);text-align:center;text-shadow:0 5px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);letter-spacing:4px}
.lb-sub{text-align:center;font-family:var(--cn);font-size:16px;color:#b9aee0;margin:12px 0 18px}
.lb-h{font-family:var(--cn);font-size:16px;color:#b9aee0;margin:0 0 8px 2px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--plum);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:11px 14px}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mode .dk{flex:none;width:44px;text-align:center;font-family:var(--px);font-weight:400;font-size:17px;line-height:1}
.mode .dk small{display:block;font-family:var(--cn);font-weight:400;font-size:11px;margin-top:3px;opacity:.75}
.mode b{font-family:var(--cn);font-weight:400;font-size:21px;display:block;line-height:1.1}
.mode span{font-size:13px;color:#cfc6f0;line-height:1.45;display:block;margin-top:3px}
.mode[aria-checked="true"]{background:var(--amber);color:var(--ink)}
.mode[aria-checked="true"] span{color:#4a3510}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--cn);font-size:18px;padding:11px 4px 10px;background:var(--plum);border:3px solid var(--ink);border-radius:11px;box-shadow:0 4px 0 var(--ink)}
.seg button[aria-checked="true"]{background:var(--amber);color:var(--ink)}
.lb-btns{display:flex;gap:8px;margin-top:22px}
.seg.opp4{gap:6px}.seg.opp4 button{font-size:16px;padding:8px 2px 7px}.seg.opp4 small{display:block;font-size:11px;margin-top:3px;opacity:.8}
.lb-btns [hidden]{display:none}
.seg.nums{gap:5px}.seg.nums button{font-family:var(--px);font-size:15px;padding:11px 0 9px}
.seg button:disabled{opacity:.3}
.seg.opp4{display:grid;grid-template-columns:repeat(4,1fr)}
.slide{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.slide input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:14px;background:var(--plum-d);border:3px solid var(--ink);border-radius:8px}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;background:var(--amber);border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink)}
.slide input::-moz-range-thumb{width:22px;height:22px;background:var(--amber);border:3px solid var(--ink);border-radius:8px}
.rv{min-width:86px;text-align:right}.rv b{display:block;font-family:var(--px);font-weight:400;font-size:17px;color:var(--amber)}.rv small{font-family:var(--cn);font-size:12px;color:#cfc6f0}
.row2s{display:flex;gap:8px}
.app.m8{--cw:min(23vw,11.4vh,100px);--ow:min(8.6vw,4.6vh,36px)}
.app.m8 .opps{grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 8px 0}
.app.m8 .oseat{padding:5px 5px 7px;gap:4px;border-width:2px;border-radius:10px}
.app.m8 .oseat .seat{gap:4px}
.app.m8 .oseat .avatar{width:24px;height:24px;border-width:2px;border-radius:6px}
.app.m8 .oseat .avatar svg{width:17px;height:17px}
.app.m8 .oseat .name{font-size:12px}
.app.m8 .oseat .sty{display:none}
.app.m8 .oseat .stack{font-size:8px;gap:3px}.app.m8 .oseat .coin{width:8px;height:8px}
.app.m8 .oseat .badges{position:absolute;right:-2px;top:-3px;max-width:none;gap:2px}
.app.m8 .oseat .badge{font-size:10px;padding:1px 3px 0}
.app.m8 .oseat .cards{gap:3px}
.app.m8 .oseat .bubble{font-size:12px;padding:3px 6px 2px;top:-14px}
.app.m8 .oseat .hname{font-size:11px;padding:1px 5px 0;bottom:-8px}
.app.m8 .steps li{font-size:11px}
.app.m8 .table{gap:6px}
@media (max-height:760px){.app.m8 .steps li{font-size:0;gap:0}.app.m8 .eff{display:none}.app.m8 .mat{padding:6px 12px}}
input{user-select:text;-webkit-user-select:text}
.net{display:flex;gap:8px;align-items:stretch}
.field{flex:1.3;min-width:0;font-family:var(--ui);font-size:17px;padding:10px 12px;background:var(--plum-d);color:var(--paper);border:3px solid var(--ink);border-radius:11px;outline:none}
.field:focus{border-color:var(--amber)}
.net .btn{font-size:17px;padding:11px 4px 10px}
.code{font-family:var(--px);font-size:32px;color:var(--amber);letter-spacing:6px;text-align:center;margin:4px 0 6px;text-shadow:0 3px 0 var(--ink)}
.seats{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.seats li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--plum-d);border:2px solid var(--ink);border-radius:9px;font-family:var(--cn);font-size:16px}
.seats li.empty{opacity:.5}
.seats li em{margin-left:auto;font-style:normal;font-size:12px;color:#cfc6f0}
.mbox .field{width:100%;margin-top:10px}

.fchip{position:absolute;z-index:15;width:16px;height:16px;background:var(--amber);border:2px solid var(--ink);border-radius:50%;box-shadow:inset -2px -2px 0 var(--amber-d);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .wob{animation:none} .inner{transition-duration:.01s}
  .card.pickable::before,.turn .avatar{animation:none}
}
@media (max-height:700px){
  .t1{font-size:23px} .pot-v{font-size:21px} .pot{padding:5px 22px 7px} .msg{min-height:22px;font-size:15px}
  .table{gap:6px} .actions{min-height:74px;padding-top:8px} .btn{padding:12px 4px 10px;font-size:17px}
  .app.m5{--cw:min(23vw,11.6vh,100px);--ow:min(10vw,5.6vh,42px)}
  .app.m5 .steps li{font-size:0;gap:0} .app.m5 .eff{display:none}
  .lb-title{font-size:44px} .lb-sub{margin:8px 0 12px} .mode{padding:8px 12px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas><div class="flashlayer" id="flashL"></div><div class="banner" id="banner"><div class="bx"><b></b><span></span></div></div>
  <div class="crt"></div>

  <header class="top">
    <button class="chip-btn" id="btnMode">模式</button>
    <div class="title"><span class="t1">诈唬牌</span><span class="t2" id="sub"></span></div>
    <div class="top-r">
      <button class="chip-btn" id="btnRules">规则</button>
      <button class="chip-btn snd" id="btnSnd" aria-pressed="true" aria-label="音效"></button>
      <button class="chip-btn" id="btnEq" aria-pressed="false" title="试玩辅助：显示你当前的胜率">胜率</button>
    </div>
  </header>

  <section class="opps" id="opps"></section>

  <section class="table">
    <ol class="steps" id="steps"></ol>
    <div class="mat"><div class="pile" id="pileL"></div><div class="pot"><div class="pot-l">底池</div><div class="pot-v" id="potV">0</div></div><div class="pile" id="pileR"></div></div><div class="eff" id="effLine"></div>
    <p class="msg" id="msg"></p>
  </section>

  <section class="zone me" id="seat0">
    <div class="hname"></div>
    <div class="cards"></div>
    <div class="seal">暗保</div>
    <div class="seat me-seat">
      <div class="stack big"><i class="coin"></i><span class="chips">0</span></div>
      <div class="hint" id="hint"></div>
      <div class="badges"></div>
      <div class="bubble"></div>
    </div>
  </section>

  <footer class="actions" id="actions"></footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <h3>加注多少</h3>
    <p id="sheetSub"></p>
    <div class="opts" id="opts"></div>
    <div class="slide"><input type="range" id="rng" step="10" aria-label="自定义加注"><div class="rv"><b id="rngV"></b><small id="rngC"></small></div></div>
    <div class="row2s"><button class="btn plum" data-a="cancel">算了</button><button class="btn amber wide" data-a="rgo">就加这么多</button></div>
  </div>

  <div class="modal" id="room"><div class="mbox" id="roomBox"></div></div>
  <div class="modal" id="rules"><div class="mbox" id="rulesBox"></div></div>

  <div class="modal" id="over">
    <div class="mbox" style="text-align:center">
      <h2 id="overT">筹码用尽</h2>
      <p id="overP"></p>
      <div class="row2"><button class="btn plum" data-a="lobby">换模式</button><button class="btn amber" data-a="restart">再来一场</button></div>
    </div>
  </div>

  <div class="lobby" id="lobby">
    <div class="lb-title">诈唬牌</div>
    <p class="lb-sub">选好牌堆和人数就开打</p>
    <div class="lb-h">牌堆</div>
    <div class="modes" id="modes" role="radiogroup" aria-label="牌堆">
      <button class="mode" role="radio" data-lo="2"><div class="dk">52<small>张</small></div><div><b>经典</b><span>完整一副牌，最接近拼三张的手感。</span></div></button>
      <button class="mode" role="radio" data-lo="7"><div class="dk">32<small>张</small></div><div><b>去小牌</b><span>去掉 2–6。对子更多，大牌不再稳赢。</span></div></button>
      <button class="mode" role="radio" data-lo="9"><div class="dk">24<small>张</small></div><div><b>只留大牌</b><span>去掉 2–8。对子和顺子都很常见。</span></div></button>
    </div>
    <div class="lb-h" style="margin-top:18px">人数 <small id="nNote" style="font-size:12px;opacity:.7"></small></div>
    <div class="seg nums" id="segN" role="radiogroup" aria-label="人数">
      <button role="radio" data-n="2">2</button><button role="radio" data-n="3">3</button><button role="radio" data-n="4">4</button><button role="radio" data-n="5">5</button><button role="radio" data-n="6">6</button><button role="radio" data-n="7">7</button><button role="radio" data-n="8">8</button>
    </div>
    <div id="oppRow">
      <div class="lb-h" style="margin-top:18px">两人局的对手</div>
      <div class="seg opp4" id="segOpp" role="radiogroup" aria-label="对手">
        <button role="radio" data-opp="1">七号<small>紧凶</small></button>
        <button role="radio" data-opp="2">小罗<small>跟注站</small></button>
        <button role="radio" data-opp="3">阿飞<small>松凶</small></button>
        <button role="radio" data-opp="4">豆豆<small>闷王</small></button>
        <button role="radio" data-opp="5">阿珍<small>石头</small></button>
        <button role="radio" data-opp="6">小狐<small>狡猾</small></button>
        <button role="radio" data-opp="7">大熊<small>均衡</small></button>
      </div>
    </div>
    <div class="lb-btns">
      <button class="btn plum" data-a="resume" id="btnResume">回到牌桌</button>
      <button class="btn amber wide" data-a="start">和 AI 开打</button>
    </div>
    <div class="lb-h" style="margin-top:22px">和朋友联机</div>
    <div class="net">
      <input class="field" id="nick" maxlength="6" placeholder="你的名字" autocomplete="off">
      <button class="btn violet" data-a="host">建房间</button>
      <button class="btn teal" data-a="joinOpen">加入</button>
    </div>
    <button class="btn rose" data-a="leave" id="btnLeave" style="margin-top:12px" hidden>离开房间</button>
  </div>
</div>

/* ---------- 拼三张 hand evaluation ---------- */
let LO=2,DECK=[];
function evalHand(h){
  let rs=h.map(c=>c.r).sort((a,b)=>b-a);
  const fl=h[0].s===h[1].s&&h[1].s===h[2].s;
  let st=rs[0]-rs[1]===1&&rs[1]-rs[2]===1;
  if(rs[0]===14&&rs[1]===LO+1&&rs[2]===LO){st=true;rs=[LO+1,LO,LO-1]}
  if(rs[0]===rs[2])return[5,rs[0]];
  if(st&&fl)return[4,...rs];
  if(fl)return[3,...rs];
  if(st)return[2,...rs];
  if(rs[0]===rs[1])return[1,rs[0],rs[2]];
  if(rs[1]===rs[2])return[1,rs[1],rs[0]];
  return[0,...rs];
}
const score=h=>{const a=evalHand(h);let v=0;for(let k=0;k<4;k++)v=v*16+(a[k]||0);return v};
function cmpArr(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]??-1,y=b[i]??-1;if(x!==y)return x>y?1:-1}return 0}
function handName(h){const e=evalHand(h);return[`单张 ${RL(e[1])}`,`对子 ${RL(e[1])}`,'顺子','金花','顺金',`豹子 ${RL(e[1])}`][e[0]]}

const live=()=>G.p.map((p,i)=>i).filter(i=>!G.p[i].folded);
const nm=i=>NET==='host'?`\u0001${i}\u0002`:i===0?'你':G.p[i].name;
const detok=(s,v)=>String(s||'').replace(/\u0001(\d)\u0002/g,(_,i)=>+i===v?'你':G.p[+i].name);
function setPrompt(start){G.msgKind='prompt';G.msgStart=start;G.msg=msgFor(start)}
const humanIn=()=>G.p.some(p=>!p.bot&&!p.folded);
const rate=p=>(p.looked?1:.5)*(BAOMODE==='double'&&p.bao&&G.stage==='C'?2:1);
const toCall=i=>G.curBet-G.p[i].eff;
const betting=()=>['A','B','C'].includes(G.stage);
function knownIdx(i){
  const p=G.p[i],k=new Set();
  p.revealed.forEach((v,j)=>v&&k.add(j));
  if(p.looked){k.add(0);k.add(1);if(sIdx(G.stage)>=sIdx('R2'))k.add(2)}
  return[...k];
}
function visStr(i){
  const v=G.p[i].cards.filter((c,j)=>G.p[i].revealed[j]).map(c=>c.r).sort((a,b)=>b-a);
  if(v.length===2&&v[0]===v[1])return[1,v[0]];
  return[0,...v];
}
function needsAct(i){const p=G.p[i];return!p.folded&&p.chips>0&&(!p.acted||p.eff<G.curBet)}
function findActor(from,incl){for(let k=incl?0:1;k<=G.n;k++){const i=(from+k)%G.n;if(needsAct(i))return i}return-1}
/* table cap: nobody can raise beyond what every live player can still call -> no side pots */
function maxRaise(i){
  const me=G.p[i];let m=Math.floor(me.chips/rate(me))-toCall(i);
  for(const j of live()){if(j===i)continue;const p=G.p[j];m=Math.min(m,Math.floor(p.chips/rate(p))-(G.curBet-p.eff))}
  return Math.floor(m/10)*10;
}
/* 加注范围：最少 20，最多底池（底池很小时至少能加到 4 个底注），且不超过在局玩家能跟得起的量 */
function raiseRange(i){
  if(G.raises>=CFG.CAP)return null;
  const mx=maxRaise(i);if(mx<10)return null;
  const p=G.p[i],tc=toCall(i),potAfter=G.pot+tc*rate(p);
  const cap=Math.max(CFG.ANTE*4,Math.floor(potAfter/10)*10),max=Math.min(mx,cap);
  return{min:Math.min(CFG.SMALL,max),max,limited:mx<cap};
}
function raiseOptions(i){
  const R=raiseRange(i);if(!R)return[];
  const p=G.p[i],tc=toCall(i);
  const list=[{k:'最小',x:R.min},{k:'半池',x:Math.max(R.min,Math.floor(R.max/20)*10)},{k:R.limited?'最大':'满池',x:R.max}];
  const out=[],seen=new Set();
  for(const o of list){if(seen.has(o.x))continue;seen.add(o.x);out.push({...o,cost:(tc+o.x)*rate(p)})}
  return out;
}
/* Monte Carlo equity from player i's own knowledge, against every live opponent */
function equity(i,iters){
  const me=G.p[i],opps=live().filter(j=>j!==i);
  if(!opps.length)return 1;
  const mk=knownIdx(i).map(k=>me.cards[k]);
  const ov=opps.map(j=>G.p[j].cards.filter((c,k)=>G.p[j].revealed[k]));
  const used=new Set(mk.map(cid));ov.forEach(a=>a.forEach(c=>used.add(cid(c))));
  const pool=DECK.filter(c=>!used.has(cid(c)));
  const needMe=3-mk.length,needs=ov.map(a=>3-a.length),need=needMe+needs.reduce((a,b)=>a+b,0);
  let w=0;
  for(let it=0;it<iters;it++){
    for(let k=0;k<need;k++){const j=k+(rnd()*(pool.length-k)|0);const t=pool[k];pool[k]=pool[j];pool[j]=t}
    const my=score(mk.concat(pool.slice(0,needMe)));let off=needMe,ties=0,lost=false;
    for(let o=0;o<ov.length;o++){const s=score(ov[o].concat(pool.slice(off,off+needs[o])));off+=needs[o];if(s>my){lost=true;break}if(s===my)ties++}
    if(!lost)w+=1/(ties+1);
  }
  return w/iters;
}

/* 牌力分位表：PCT3[三张分数]=在当前牌堆所有三张组合里的分位；PCT2[两张]=补第三张后的平均分位 */
let PCT3=null,PCT2=null;
function buildTables(){
  const n=DECK.length,all=[];
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)all.push(score([DECK[a],DECK[b],DECK[c]]));
  all.sort((x,y)=>x-y);PCT3=new Float32Array(65536);
  for(let k=0;k<all.length;){let e=k;while(e<all.length&&all[e]===all[k])e++;PCT3[all[k]]=(k+(e-k)/2)/all.length;k=e}
  PCT2=new Float32Array(64*64);
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){let t=0;for(let c=0;c<n;c++)if(c!==a&&c!==b)t+=PCT3[score([DECK[a],DECK[b],DECK[c]])];
    const v=t/(n-2);PCT2[cid(DECK[a])*64+cid(DECK[b])]=v;PCT2[cid(DECK[b])*64+cid(DECK[a])]=v}
}
/* 某个动作在牌力 s(0~1) 下出现的相对可能性 */
function lik(a,s){
  switch(a){
    case'raise':return .1+.9*s*s*s*s;
    case'call':return .3+.7*s;
    case'check':return 1-.55*s*s*s;
    case'bao':return .25+s*s*s;
    case'show':return 1-.3*s*s*s;
  }
  return 1;
}
/* 对手记忆：一场里每个人的诈唬率、被加注后的弃牌率（带先验，前几局保持中性）。
   只用开牌时大家都能看到的牌来统计，不偷看任何暗牌 */
const newStats=n=>Array.from({length:n},()=>({sd:0,bluff:0,faced:0,folds:0}));
const bluffRate=j=>{const t=G.stats&&G.stats[j];return t?(t.bluff+1)/(t.sd+4):.25};
const foldRate=j=>{const t=G.stats&&G.stats[j];return t?(t.folds+2)/(t.faced+5):.4};
/* 越爱诈唬，他的加注和暗保越不可信 */
const raiseTrust=j=>Math.max(.3,Math.min(1.3,1.3-2*(bluffRate(j)-.15)));
/* 亮牌选择也是线索：大多数人会把大牌、成对的那张藏起来。
   rev1：前两张里亮了 k；rev2：在剩下两张里亮了 k（f 是第一轮亮的那张） */
function revLik(e,h){
  if(e.a==='rev1'){const v=h[e.k].r,o=h[1-e.k].r;return v===o?1:v<o?.6:.4}
  const alt=3-e.k-e.f,vis=h[e.f].r,showPair=h[e.k].r===vis,altPair=h[alt].r===vis;
  if(showPair&&!altPair)return .35;
  if(altPair&&!showPair)return 1;
  return h[e.k].r<h[alt].r?.65:.35;
}
/* 读牌胜率：按对手每一步动作给他们可能的暗牌加权（trust 控制相信程度） */
function equityW(i,iters,trust){
  const me=G.p[i],opps=live().filter(j=>j!==i),readRev=me.readRev===true,model=me.model!==false;
  if(!opps.length)return 1;
  const mk=knownIdx(i).map(k=>me.cards[k]),used=new Set(mk.map(cid));
  const O=opps.map(j=>{const p=G.p[j],fix=p.cards.map((c,k)=>p.revealed[k]?c:null);fix.forEach(c=>c&&used.add(cid(c)));
    return{fix,rt:model?raiseTrust(j):1,hid:[0,1,2].filter(k=>!fix[k]),hist:p.hist.filter(e=>e.looked&&(readRev||(e.a!=='rev1'&&e.a!=='rev2')))}});
  const pool=DECK.filter(c=>!used.has(cid(c)));
  const needMe=3-mk.length;let need=needMe;O.forEach(o=>need+=o.hid.length);
  const h=[null,null,null];let W=0,T=0;
  for(let it=0;it<iters;it++){
    for(let k=0;k<need;k++){const j=k+(rnd()*(pool.length-k)|0);const t=pool[k];pool[k]=pool[j];pool[j]=t}
    const my=score(mk.concat(pool.slice(0,needMe)));let off=needMe,w=1,ties=0,lost=false;
    for(const o of O){
      h[0]=o.fix[0];h[1]=o.fix[1];h[2]=o.fix[2];for(const k of o.hid)h[k]=pool[off++];
      const sc=score(h);
      if(trust>0&&o.hist.length){
        const s3=PCT3[sc],s2=PCT2[cid(h[0])*64+cid(h[1])];let l=1;
        let la=1;
        for(const e of o.hist){if(e.a==='raise'||e.a==='bao')la*=lik(e.a,(e.st==='A'||e.st==='B')?s2:s3);
          else l*=(e.a==='rev1'||e.a==='rev2')?revLik(e,h):lik(e.a,(e.st==='A'||e.st==='B')?s2:s3)}
        w*=(trust===1?l:Math.pow(l,trust))*(la===1?1:Math.pow(la,trust*o.rt));
      }
      if(sc>my)lost=true;else if(sc===my)ties++;
    }
    T+=w;if(!lost)W+=w/(ties+1);
  }
  return T>0?W/T:0;
}

/* ---------- session & flow ---------- */
function startSession(){
  token++;
  LO=S.lo;DECK=[];for(let s=0;s<4;s++)for(let r=LO;r<=14;r++)DECK.push({r,s});
  G={n:S.n,lo:LO,hand:0,dealer:S.n-1,p:[],pot:0,stage:'ante',turn:-1,curBet:0,raises:0,raiseBy:[],first:-1,pick:null,humanBao:false,locked:false,result:null,fast:false,skip:false,msg:''};
  for(let i=0;i<S.n;i++){const who=i===0?0:S.n===2?S.opp:i;
    G.p.push({who,name:NAMES[who],style:BOTSTYLE[who],bot:i>0,policy:'new',baoPol:'ai',chips:CFG.START,cards:[],hist:[],looked:false,revealed:[false,false,false],bao:false,folded:false,eff:0,acted:false,startChips:CFG.START})}
  eqCache.k='';G.baoCost=CFG.BAO;G.stats=newStats(G.n);
  buildTables();
  if(!SIM)buildTable();
  $('#lobby').classList.remove('on');$('#over').classList.remove('on');
  newHand();
}
function newHand(){
  token++;G.fast=false;G.skip=false;
  if(SIM)G.p.forEach(p=>p.chips=CFG.START);
  if(NET==='off'){
    if(G.p[0].chips<CFG.ANTE)return gameOver(false);
    if(G.n===2&&G.p[1].chips<CFG.ANTE)return gameOver(true);
  }
  const rebuy=[];
  G.p.forEach((p,i)=>{if((i>0||NET!=='off')&&p.chips<CFG.ANTE){p.chips=CFG.START;rebuy.push(nm(i))}});
  G.hand++;G.dealer=(G.dealer+1)%G.n;
  const deck=shuffle(DECK.slice());
  G.p.forEach(p=>Object.assign(p,{cards:deck.splice(0,3),looked:false,revealed:[false,false,false],bao:false,folded:false,eff:0,acted:false,startChips:p.chips,blindPlan:!!p.style&&rnd()<STYLES[p.style].blind,aiPick:null,choice:null,hist:[],r2:false,didBao:false}));
  Object.assign(G,{r2pot:0,pot:0,stage:'ante',turn:-1,curBet:0,raises:0,raiseBy:[],first:-1,pick:null,humanBao:false,locked:false,result:null});
  G.msgKind='event';G.msg=rebuy.length?`${rebuy.join('、')}补充了筹码`:`发牌，每人下底注 ${CFG.ANTE}`;
  hideSheet();clearFaces();potShown=G.pot;$('#potV').textContent=G.pot;render();dealAnim();
  later(()=>{G.p.forEach((p,i)=>pay(i,CFG.ANTE));render()},520);
  later(()=>startStreet('A'),1300);
}
function startStreet(st){
  G.stage=st;G.curBet=0;G.raises=0;G.raiseBy=[];
  G.p.forEach(p=>{p.eff=0;p.acted=false});
  let first=(G.dealer+1)%G.n;
  if(st!=='A'){
    let best=null;
    for(let k=1;k<=G.n;k++){const i=(G.dealer+k)%G.n;if(G.p[i].folded)continue;const v=visStr(i);if(best===null||cmpArr(v,best)>0){best=v;first=i}}
  }
  if(st==='C'&&BAOMODE==='first'){for(let k=1;k<=G.n;k++){const i=(G.dealer+k)%G.n;if(!G.p[i].folded&&G.p[i].bao){first=i;break}}}
  G.first=first;
  const t=findActor(first,true);
  if(t<0){G.turn=-1;G.msgKind='event';G.msg='没人还能下注，直接进入下一步';render();return later(endStreet,900)}
  G.turn=t;setPrompt(true);render();schedule();
}
function schedule(){
  if(G.turn<0)return;const i=G.turn;
  if(G.p[i].bot){const t=G.n>2?THINK.table:THINK.duel;later(()=>aiAct(i),t[0]+rnd()*t[1])}
  else if(G.p[i].remote){clearTimeout(G.turnTimer);const t=token;G.turnTimer=setTimeout(()=>{if(t===token&&G.turn===i&&!G.result)act(i,toCall(i)>0?'fold':'check')},45000)}
}
function act(i,a,x){
  if(G.turn!==i||G.result)return;
  const p=G.p[i];clearTimeout(G.turnTimer);
  if(G.stats&&toCall(i)>0&&G.raiseBy.length&&G.raiseBy[G.raiseBy.length-1]!==i){G.stats[i].faced++;if(a==='fold')G.stats[i].folds++}
  if(a==='fold'){
    p.folded=true;bubble(i,'弃牌','rose');
    if(i===0)G.fast=true;
    const L=live();
    if(L.length===1){G.turn=-1;G.msgKind='event';G.msg=`${nm(i)}弃牌了`;render();return later(()=>endHand(L,'fold'),800)}
  }else if(a==='check'){p.acted=true;p.hist.push({a:'check',st:G.stage,looked:p.looked});bubble(i,'过牌')}
  else if(a==='call'){const c=toCall(i)*rate(p);p.hist.push({a:'call',st:G.stage,looked:p.looked});pay(i,c);p.eff=G.curBet;p.acted=true;bubble(i,`${p.looked?'跟注':'闷跟'} ${c}`,'teal')}
  else if(a==='raise'){
    const nb=G.curBet+x,c=(nb-p.eff)*rate(p);pay(i,c);
    p.eff=nb;G.curBet=nb;G.raises++;p.acted=true;G.raiseBy.push(i);p.hist.push({a:'raise',st:G.stage,looked:p.looked});
    G.p.forEach((q,j)=>{if(j!==i&&!q.folded)q.acted=false});
    bubble(i,`${p.looked?'加注':'闷加'} ${x}`,'amber');
  }
  const nx=findActor(i,false);
  if(nx<0){G.turn=-1;G.msgKind='event';G.msg='这一轮下注结束';render();return later(endStreet,1200)}
  G.turn=nx;setPrompt(false);render();schedule();
}
function endStreet(){
  if(G.stage==='A')startReveal('R1');
  else if(G.stage==='B')startReveal('R2');
  else showdown();
}
function startReveal(st){
  Object.assign(G,{stage:st,turn:-1,pick:null,humanBao:false,locked:false,revealing:false});
  G.p.forEach(p=>p.choice=null);
  if(st==='R2')G.r2pot=G.pot;
  G.baoCost=BAOK>0?Math.max(CFG.ANTE,Math.ceil(G.pot*BAOK/10)*10):CFG.BAO;
  G.p.forEach((p,i)=>{if(p.bot&&!p.folded)p.aiPick=aiReveal(i,st)});
  setPrompt(true);render();
  if(!humanIn()){G.locked=true;G.revealing=true;later(doReveal,900);return}
  if(NET==='host'){const t=token;clearTimeout(G.revealTimer);G.revealTimer=setTimeout(()=>{if(t!==token||G.revealing)return;
    G.p.forEach((p,i)=>{if(p.remote&&!p.folded&&p.choice==null)p.choice=G.stage==='R1'?(p.revealed[0]?1:0):[0,1,2].find(k=>!p.revealed[k])});checkRevealReady();render()},45000)}
}
function confirmReveal(bao){
  if(G.locked||!(G.stage==='R1'||G.stage==='R2')||G.p[0].folded)return;
  if(!bao&&G.pick==null)return;
  G.locked=true;G.humanBao=bao;G.p[0].choice=bao?'bao':G.pick;
  if(!checkRevealReady()){G.msgKind='event';G.msg='等其他人选好…';render()}
}
function checkRevealReady(){
  if(G.revealing)return true;
  if(!G.p.every(p=>p.bot||p.folded||p.choice!=null))return false;
  G.revealing=true;G.locked=true;clearTimeout(G.revealTimer);G.msgKind='event';G.msg='大家同时翻开';render();later(doReveal,380);return true;
}
function doReveal(){
  const st=G.stage,baoers=[];
  G.p.forEach((p,i)=>{
    if(p.folded)return;
    const ch=p.bot?p.aiPick:p.choice;

/* ---------- AI ---------- */
function revealChoice(a,un,cat){
  const vis=a.cards[a.revealed.indexOf(true)];
  const opts=un.map(j=>{const c=a.cards[j];return{j,expose:(c.r===vis.r?3:0)+(c.s===vis.s&&(cat===3||cat===4)?2:0)+(Math.abs(c.r-vis.r)<=2&&c.r!==vis.r&&(cat===2||cat===4)?1:0),r:c.r}});
  opts.sort((p,q)=>p.expose-q.expose||p.r-q.r);
  return{best:(cat>=1||rnd()<.65)?opts[0].j:opts[1].j,minExpose:opts[0].expose};
}
/* 明牌看起来有多吓人：亮对子、亮大牌、亮同花连张 */
function scare(i){
  const v=G.p[i].cards.filter((c,k)=>G.p[i].revealed[k]);if(!v.length)return 0;
  if(v.length===2&&v[0].r===v[1].r)return 1;
  const hi=Math.max(...v.map(c=>c.r));let s=hi>=13?.6:hi>=12?.4:0;
  if(v.length===2&&(v[0].s===v[1].s||Math.abs(v[0].r-v[1].r)<=2))s=Math.max(s,.45);
  return s;
}
function aiReveal(i,st){
  const a=G.p[i];if(a.policy==='v1')return aiRevealV1(i,st);
  const sty=STYLES[a.style],un=[0,1,2].filter(k=>!a.revealed[k]);
  if(st==='R1'){
    if(!a.looked)return rnd()<.5?0:1;
    const[x,y]=a.cards;if(x.r===y.r)return rnd()<.5?0:1;
    const lo=x.r<y.r?0:1;return rnd()<(sty.bluff>1?.48:.62)?lo:1-lo;
  }
  const cost=G.baoCost,canBao=a.chips>=cost;
  if(a.baoPol==='always'&&canBao)return'bao';
  if(!a.looked){const c=un[rnd()*un.length|0];return a.baoPol!=='never'&&canBao&&rnd()<.1*sty.bao?'bao':c}
  const cat=evalHand(a.cards)[0],ch=revealChoice(a,un,cat);
  if(a.baoPol==='never'||!canBao)return ch.best;
  const base=cat>=2?.45:cat===1?(ch.minExpose>=3?.6:.2):.07+.1*scare(i);
  const price=cost/Math.max(G.pot,1);
  return rnd()<base*sty.bao*Math.max(0,1.2-2.4*price)?'bao':ch.best;
}
function aiAct(i){
  if(G.turn!==i||G.result)return;
  const a=G.p[i];if(a.policy==='v1')return aiActV1(i);
  const sty=STYLES[a.style],tc=toCall(i);
  if(!a.looked){
    const lp=!a.blindPlan?1:({A:.1,B:.3,C:.45}[G.stage]||0)+(tc>0&&G.raises>=2?.3:0);
    if(rnd()<lp){a.looked=true;bubble(i,'看牌','violet');render();return later(()=>aiAct(i),THINK.look)}
  }
  const L=live().length,fair=1/L;
  const e=equityW(i,G.n>2?450:800,sty.trust);
  const opts=raiseOptions(i),r=rnd(),cost=tc*rate(a),po=cost/(G.pot+cost);
  const others=live().filter(j=>j!==i),fr=a.model===false?.4:others.reduce((t,j)=>t+foldRate(j),0)/Math.max(1,others.length);
  const bluffMul=Math.max(.4,Math.min(2.2,fr/.4)),thin=a.model===false?1:Math.max(.9,Math.min(1.05,1-(.4-fr)*.35));
  const valueT=Math.min(.92,(L>2?Math.max(.42,fair*2.1):.62)*sty.value*thin);
  const strongT=Math.min(.96,(L>2?Math.max(.6,fair*3):.8)*sty.value);
  const size=big=>opts[big?opts.length-1:Math.min(1,opts.length-1)].x;
  /* 均衡下注：好牌和诈唬用同一套大小分布，只靠下注大小读不出牌力 */
  const pBig=Math.min(.85,.2+.7*sty.big),mix=nuts=>a.balSize===false?nuts:rnd()<pBig+(nuts?.08:0);
  const sc=scare(i),margin=(G.stage==='C'?.03:G.stage==='B'?0:-.06)+sty.call;
  /* 难的决定多想一会儿，明显的决定出手快 */
  const hard=tc>0?Math.abs(e-po-margin)<.07:Math.abs(e-valueT)<.06;
  const go=(A,X)=>{if(SIM)return act(i,A,X);const d=hard?900+rnd()*1500:150+rnd()*350;later(()=>act(i,A,X),d)};
  if(tc===0){
    if(sty.slow&&e>strongT&&G.stage!=='C'&&r<sty.slow)return go('check');
    if(opts.length&&e>valueT&&r<.55+.4*sty.aggr)return go('raise',size(a.balSize===false?(e>strongT||rnd()<sty.big*.5):mix(e>strongT)));
    const bp=({A:.05,B:.09,C:.12}[G.stage])*(1+1.5*sc)*sty.bluff*bluffMul/Math.pow(L-1,1.2);
    if(opts.length&&e<.45&&r<bp)return go('raise',size(a.balSize===false?rnd()<sty.big:mix(false)));
    return go('check');
  }
  if(opts.length&&e>strongT&&r<.4+.5*sty.aggr+(sty.slow?.3:0))return go('raise',size(a.balSize===false?true:mix(true)));
  if(e>=po+margin&&e>.02)return go('call');
  if(opts.length&&G.stage!=='C'&&r<.04*sty.bluff*(1+sc)/Math.pow(L-1,1.5))return go('raise',size(a.balSize===false?true:mix(false)));
  return go('fold');
}
/* 旧版 AI，只用于模拟对比 */
function aiRevealV1(i,st){
  const a=G.p[i],un=[0,1,2].filter(k=>!a.revealed[k]);
  if(st==='R1'){
    if(!a.looked)return rnd()<.5?0:1;
    const[x,y]=a.cards;if(x.r===y.r)return rnd()<.5?0:1;
    const lo=x.r<y.r?0:1;return rnd()<.62?lo:1-lo;
  }
  const canBao=a.chips>=G.baoCost;
  if(a.baoPol==='always'&&canBao)return'bao';
  if(!a.looked)return a.baoPol!=='never'&&canBao&&rnd()<.12?'bao':un[rnd()*un.length|0];
  const cat=evalHand(a.cards)[0];
  if(a.baoPol!=='never'&&canBao&&rnd()<(cat>=2?.4:cat===1?.18:.1))return'bao';
  return revealChoice(a,un,cat).best;
}
function aiActV1(i){
  const a=G.p[i],tc=toCall(i);
  if(!a.looked){
    const lp=!a.blindPlan?1:({A:.12,B:.35,C:.5}[G.stage]||0)+(tc>0&&G.raises>=2?.3:0);
    if(rnd()<lp){a.looked=true;return later(()=>aiAct(i),THINK.look)}
  }
  const L=live().length,fair=1/L;
  const others=G.raiseBy.filter(j=>j!==i).length;
  const e=equity(i,G.n>2?260:500)-others*.08*fair;
  const rel=e/fair,opts=raiseOptions(i),r=rnd(),cost=tc*rate(a),po=cost/(G.pot+cost);
  const rT=L>2?1.7:1.4,bT=L>2?2.3:1.64,bluff=({A:.1,B:.14,C:.18}[G.stage])/(L-1);
  const big=()=>opts[opts.length-1].x,mid=()=>opts[Math.min(1,opts.length-1)].x,small=()=>opts[0].x;
  if(tc===0){
    if(opts.length&&rel>rT&&r<.8)return act(i,'raise',rel>bT?big():mid());
    if(opts.length&&rel>1.04&&r<.3)return act(i,'raise',small());
    if(opts.length&&r<bluff)return act(i,'raise',small());
    return act(i,'check');
  }
  if(opts.length&&rel>bT*.95&&r<.55)return act(i,'raise',rel>bT*1.07?big():mid());
  if(e>=po-(G.stage==='A'?.1:.03)*(L>2?.6:1))return act(i,'call');
  if(opts.length&&r<.06/(L-1))return act(i,'raise',mid());
  return act(i,'fold');
}

/* ---------- 批量模拟（地址加 #sim 时可用） ---------- */
function runSim(o){
  SIM=true;simQ=[];
  Object.assign(S,{lo:o.lo||2,n:o.n||2,opp:o.opp||1});
  if(o.baok!==undefined)BAOK=o.baok;BAOMODE=o.baomode||'fee';
  startSession();
  G.p.forEach((p,i)=>{p.bot=true;const v=(o.seats||[])[i]||{};p.style=v.style||p.style||'tag';p.policy=v.policy||'new';p.baoPol=v.bao||'ai';p.readRev=v.rev===true;p.balSize=v.bal!==false;p.model=v.model!==false});
  const n=G.n,R={r2pot:0,r2hands:0,st:Array.from({length:n},()=>({raise:0,call:0,check:0,fold:0,bluff:0,blindAct:0,vpip:0})),hands:0,net:Array(n).fill(0),sq:Array(n).fill(0),bao:Array(n).fill(0),r2:Array(n).fill(0),won:Array(n).fill(0),show:0,pot:0};
  let guard=0;
  while(R.hands<o.hands&&guard++<5e7){
    if(simQ.length){simQ.shift()();continue}
    if(!G.result)break;
    G.p.forEach((p,i)=>{const d=p.chips-p.startChips;R.net[i]+=d;R.sq[i]+=d*d;if(p.r2)R.r2[i]++;if(p.didBao)R.bao[i]++;
      const t=R.st[i],s3=PCT3[score(p.cards)],s2=PCT2[cid(p.cards[0])*64+cid(p.cards[1])];
      if(p.hist.some(e=>e.a==='call'||e.a==='raise'))t.vpip++;
      if(p.folded)t.fold++;
      for(const e of p.hist){if(t[e.a]!==undefined&&e.a!=='fold')t[e.a]++;if(!e.looked)t.blindAct++;
        if(e.a==='raise'&&e.looked&&((e.st==='A'||e.st==='B')?s2:s3)<.45)t.bluff++}});
    if(G.r2pot){R.r2pot+=G.r2pot;R.r2hands++}
    G.result.W.forEach(i=>R.won[i]++);
    if(G.result.how==='show')R.show++;R.pot+=G.result.pot;R.hands++;
    if(o.resetEvery&&R.hands%o.resetEvery===0)G.stats=newStats(G.n);
    newHand();
  }
  SIM=false;return R;
}

  if(G.turn>0)return start&&st!=='A'?`${nm(G.turn)}的明牌最大，先说话`:`${nm(G.turn)}在想…`;

/* ---------- 音效：WebAudio 实时合成 8-bit 音 ---------- */
const AU={ctx:null,master:null,on:S.sound!==false};
function ac(){
  if(SIM)return null;
  if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.32;AU.master.connect(AU.ctx.destination)}

  return AU.ctx;
}
function tone(f,d,o={}){
  const c=ac();if(!c||!AU.on)return;
  const t=c.currentTime+(o.at||0),osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);
  if(o.slide)osc.frequency.linearRampToValueAtTime(Math.max(30,f+o.slide),t+d);
  const v=o.vol??.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  osc.connect(g);g.connect(AU.master);osc.start(t);osc.stop(t+d+.02);
}
let NOISE=null;
function noise(d,o={}){
  const c=ac();if(!c||!AU.on)return;
  if(!NOISE){NOISE=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const a=NOISE.getChannelData(0);for(let k=0;k<a.length;k++)a[k]=Math.random()*2-1}
  const t=c.currentTime+(o.at||0),src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=NOISE;f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||3000,t);if(o.fslide)f.frequency.linearRampToValueAtTime(o.fslide,t+d);
  const v=o.vol??.15;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  src.connect(f);f.connect(g);g.connect(AU.master);src.start(t);src.stop(t+d+.02);
}
const arp=(notes,step,o)=>notes.forEach((f,k)=>tone(f,o.d||.09,{...o,at:(o.at||0)+k*step}));

/* ---------- 特效：像素粒子 / 冲击波 / 震屏 / 横幅 ---------- */
const FX={cv:null,cx:null,parts:[],rings:[],run:false,px:3};
function fxInit(){
  FX.cv=$('#fx');FX.cx=FX.cv.getContext('2d');
  const rs=()=>{const r=app.getBoundingClientRect();FX.cv.width=Math.ceil(r.width/FX.px);FX.cv.height=Math.ceil(r.height/FX.px)};
  rs();addEventListener('resize',rs);
}
const PCOL=['#ffb627','#27c4a8','#e8475f','#8c6cf0','#f4efe3','#4fa3ff'];
function burst(x,y,o={}){
  if(SIM||(G&&G.skip))return;
  const n=reduce?Math.ceil((o.n||20)/4):(o.n||20),cols=o.cols||PCOL;
  for(let k=0;k<n;k++){const a=(o.dir??-Math.PI/2)+(rnd()-.5)*(o.spread??Math.PI*2),v=(o.speed||3)*(.4+rnd()*.8);
    FX.parts.push({x:x/FX.px,y:y/FX.px,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:o.g??.12,life:o.life||40+rnd()*25,t:0,c:cols[k%cols.length],s:o.size||(rnd()<.3?2:1)})}
  loop();
}
function ring(x,y,col){if(SIM||reduce)return;FX.rings.push({x:x/FX.px,y:y/FX.px,r:2,t:0,c:col||'#ffb627'});loop()}
function loop(){
  if(FX.run)return;FX.run=true;
  const step=()=>{
    const c=FX.cx,W=FX.cv.width,H=FX.cv.height;c.clearRect(0,0,W,H);
    FX.parts=FX.parts.filter(p=>{p.t++;p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;if(p.t>p.life)return false;
      c.globalAlpha=Math.min(1,(p.life-p.t)/12);c.fillStyle=p.c;c.fillRect(p.x|0,p.y|0,p.s,p.s);return true});
    FX.rings=FX.rings.filter(r=>{r.t++;r.r+=1.6;if(r.t>16)return false;c.globalAlpha=1-r.t/16;c.fillStyle=r.c;
      const N=Math.max(12,r.r*4|0);for(let k=0;k<N;k++){const a=k/N*Math.PI*2;c.fillRect((r.x+Math.cos(a)*r.r)|0,(r.y+Math.sin(a)*r.r*.8)|0,1,1)}return true});
    c.globalAlpha=1;
    if(FX.parts.length||FX.rings.length)requestAnimationFrame(step);else{FX.run=false;c.clearRect(0,0,W,H)}
  };
  requestAnimationFrame(step);
}

    seats.push(nmx?`<li><span>${clean(nmx)}</span><em>${i===0?'房主':i===room.me?'你':'玩家'}</em></li>`:`<li class="empty"><span>空位</span><em>开局后由 bot 补上</em></li>`)}
  b.innerHTML=`<h2>${NET==='host'?'房间已建好':'已进入房间'}</h2>
    <div class="code">${room.code||'····'}</div>
    <p style="margin-top:0;text-align:center">${extra||(NET==='host'?'把房间号告诉朋友，在大厅点「加入」输入。':'等房主开始。')}</p>
    <p style="text-align:center">${DECKNAME[room.lo]}，${NLABEL(room.n)}</p>
    <ol class="seats">${seats.join('')}</ol>
    <div class="row2">${B(NET==='host'?'解散':'离开','plum','leave')}${NET==='host'?B('开始','amber wide','netStart',!room.code):''}</div>`;
  $('#room').classList.add('on');
}
function roomError(msg){
  const b=$('#roomBox');
  b.innerHTML=`<h2>没连上</h2><p>${msg}</p><div class="row2">${B('知道了','plum','leave')}</div>`;
  $('#room').classList.add('on');
}
function hostRoom(){
  leaveNet();NET='host';
  const code=String(1000+cryptoInt(9000)),me=clean($('#nick').value)||'房主';
  room={code:null,n:S.n,lo:S.lo,names:[me],me:0,started:false};
  roomView('正在创建房间…');
  peer=new Peer(roomId(code),PEER_OPTS);
  peer.on('open',()=>{room.code=code;roomView()});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&NET==='host'&&!room.started){hostRoom();return}if(!room||!room.started){leaveNet();roomError(netErr(e))}});
  peer.on('connection',c=>{
    c.on('data',m=>onHostData(c,m));
    c.on('close',()=>onGuestLeft(c));
  });
}
function sendRoom(){
  room.names=[room.names[0],...conns.map(e=>e.name)];
  conns.forEach((e,k)=>{try{e.conn.send({t:'room',code:room.code,n:room.n,lo:room.lo,names:room.names,me:k+1})}catch(_){}});
  if(!room.started)roomView();
}
function onHostData(c,m){
  if(!m||typeof m!=='object')return;
  const ce=conns.find(x=>x.conn===c);if(ce)ce.last=Date.now();
  if(m.t==='ping')return;
  if(m.t==='hello'){
    if(room.started){c.send({t:'err',msg:'这一场已经开始了'});setTimeout(()=>c.close(),400);return}
    if(conns.length>=room.n-1){c.send({t:'err',msg:'房间已经满了'});setTimeout(()=>c.close(),400);return}
    conns.push({conn:c,name:clean(m.name)||('玩家'+(conns.length+2)),seat:null,last:Date.now()});sendRoom();return;
  }
  const e=conns.find(x=>x.conn===c);if(!e||e.seat==null||!G)return;
  const i=e.seat,p=G.p[i];if(!p||p.bot)return;
  if(m.t==='act'){
    const x=+m.x,ok=G.turn===i&&!G.result&&(m.a==='fold'||(m.a==='check'&&toCall(i)===0)||(m.a==='call'&&toCall(i)>0)||(m.a==='raise'&&(R=>R&&x>=R.min&&x<=R.max&&x%10===0)(raiseRange(i))));
    if(ok)act(i,m.a,x);
  }else if(m.t==='look'){
    if(!p.looked&&!p.folded&&!G.result){p.looked=true;bubble(i,'看牌','violet');if(G.msgKind==='prompt')setPrompt(G.msgStart);render()}
  }else if(m.t==='reveal'){
    if(!(G.stage==='R1'||G.stage==='R2')||G.revealing||p.folded||p.choice!=null)return;
    if(m.bao){if(G.stage==='R2'&&p.chips>=G.baoCost)p.choice='bao';else return}
    else{const k=+m.pick;if(!(k>=0&&k<3)||p.revealed[k]||(G.stage==='R1'&&k>1))return;p.choice=k}
    if(!checkRevealReady())render();
  }
}
function onGuestLeft(c){
  const k=conns.findIndex(x=>x.conn===c);if(k<0||!room)return;
  const e=conns[k];
  if(!room.started){conns.splice(k,1);sendRoom();return}
  e.conn=null;if(!G||e.seat==null)return;
  const i=e.seat,p=G.p[i];p.bot=true;p.remote=false;p.style='tag';p.blindPlan=false;
  bubble(i,'掉线，bot 代打','rose');
  if((G.stage==='R1'||G.stage==='R2')&&!p.folded&&p.choice==null&&!G.revealing){p.aiPick=aiReveal(i,G.stage);p.choice=p.aiPick;checkRevealReady()}
  else if(G.turn===i)schedule();
  render();
}
function startNetGame(){
  if(NET!=='host'||!room||!room.code)return;
  room.started=true;conns=conns.filter(e=>e.conn&&e.conn.open);
  token++;LO=room.lo;DECK=[];for(let s=0;s<4;s++)for(let r=LO;r<=14;r++)DECK.push({r,s});
  G={n:room.n,lo:LO,hand:0,dealer:room.n-1,p:[],pot:0,stage:'ante',turn:-1,curBet:0,raises:0,raiseBy:[],first:-1,pick:null,humanBao:false,locked:false,result:null,fast:false,skip:false,msg:'',events:[]};
  for(let i=0;i<room.n;i++){
    const g=conns[i-1],base={who:i,policy:'new',baoPol:'ai',chips:CFG.START,cards:[],hist:[],looked:false,revealed:[false,false,false],bao:false,folded:false,eff:0,acted:false,startChips:CFG.START};
    if(i===0)G.p.push({...base,name:room.names[0],human:true,bot:false});
    else if(g){g.seat=i;G.p.push({...base,name:g.name,human:true,bot:false,remote:true})}
    else G.p.push({...base,name:NAMES[i],style:BOTSTYLE[i],bot:true});
  }
  eqCache.k='';G.baoCost=CFG.BAO;G.stats=newStats(G.n);buildTables();buildTable();
  $('#lobby').classList.remove('on');$('#room').classList.remove('on');
  conns.forEach(e=>{try{e.conn.send({t:'start',seat:e.seat,lo:LO,n:G.n})}catch(_){}});
  newHand();
}
function joinRoom(code,name){
  leaveNet();NET='guest';
  room={code,n:0,lo:2,names:[],me:0};lastHost=0;
  roomView('正在连接房间…');
  const myToken=token;
  peer=new Peer(PEER_OPTS);
  const fail=setTimeout(()=>{if(NET==='guest'&&!room.n){leaveNet();roomError('连接超时：可能不在同一个网络，或网络拦截了点对点连接')}},15000);
  peer.on('open',()=>{
    hostConn=peer.connect(roomId(code),{reliable:true,serialization:'json'});
    hostConn.on('open',()=>hostConn.send({t:'hello',name}));
    hostConn.on('data',m=>{if(m&&m.t==='room')clearTimeout(fail);onGuestData(m)});
    hostConn.on('close',()=>{if(NET==='guest'){leaveNet();roomError('和房主断开了')}});
  });
  peer.on('error',e=>{if(NET==='guest'){clearTimeout(fail);leaveNet();roomError(netErr(e))}});
}
function onGuestData(m){
  if(!m||typeof m!=='object')return;
  lastHost=Date.now();if(m.t==='ping')return;
  if(m.t==='room'){room={code:m.code,n:m.n,lo:m.lo,names:m.names,me:m.me};if(!G)roomView()}
  else if(m.t==='err'){leaveNet();roomError(clean(m.msg)||'进不去这个房间')}
  else if(m.t==='bye'){leaveNet();roomError('房主解散了房间')}
  else if(m.t==='start'){LO=+m.lo;DECK=[];for(let s=0;s<4;s++)for(let r=LO;r<=14;r++)DECK.push({r,s});G=null;
    $('#room').classList.remove('on');$('#lobby').classList.remove('on')}
  else if(m.t==='state')applyState(m);
}
function applyState(v){
  const prev=G,fresh=!prev||prev.hand!==v.hand;
  v.p.forEach(p=>p.name=clean(p.name));
  if(!prev||prev.n!==v.n){G=v;buildTable()}
  if(fresh||(prev&&prev.stage!==v.stage)){localPick=null;localLocked=false}
  G=v;G.pick=localPick;G.locked=localLocked||v.myChoice;
  if(v.msg==null)G.msg=msgFor(v.msgStart);
  if(fresh){clearFaces();render();dealAnim()}else render();
  if(prev&&!fresh)v.p.forEach((p,i)=>{const d=p.chips-prev.p[i].chips;if(d<0)fly(seatEls[i].querySelector('.chips'),$('#potV'),Math.min(4,Math.ceil(-d/30)));else if(d>0&&v.result)flyOut(i)});
  (v.events||[]).forEach(e=>bubble(e.i,e.text,e.cls,e.quiet));
}
const send=m=>{if(hostConn&&hostConn.open)hostConn.send(m)};
/* 心跳：每 3 秒互报一次，12 秒没消息算掉线 */
let lastHost=0;
setInterval(()=>{
  const now=Date.now();
  if(NET==='host'){
    conns.forEach(e=>{if(e.conn&&e.conn.open){try{e.conn.send({t:'ping'})}catch(_){}}});
    conns.filter(e=>e.conn&&e.last&&now-e.last>12000).forEach(e=>{const c=e.conn;try{c.close()}catch(_){}onGuestLeft(c)});
  }else if(NET==='guest'&&hostConn){
    send({t:'ping'});
    if(lastHost&&now-lastHost>12000){leaveNet();roomError('和房主断开了')}
  }
},3000);

/* ---------- input ---------- */
app.addEventListener('click',e=>{
  const m=e.target.closest('[data-lo]');if(m){S.lo=+m.dataset.lo;saveS();syncLobby();return}
  const n=e.target.closest('[data-n]');if(n){S.n=+n.dataset.n;saveS();syncLobby();return}
  const op=e.target.closest('[data-opp]');if(op){S.opp=+op.dataset.opp;saveS();syncLobby();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const A=b.dataset.a,doAct=(a,x)=>NET==='guest'?send({t:'act',a,x}):act(0,a,x);
  switch(A){
    case'fold':case'check':case'call':doAct(A);break;
    case'raise':showSheet();break;
    case'rgo':hideSheet();doAct('raise',+$('#rng').value);break;
    case'r':hideSheet();doAct('raise',+b.dataset.x);break;
    case'cancel':hideSheet();break;
    case'look':if(NET==='guest'){send({t:'look'});break}
      G.p[0].looked=true;bubble(0,'看牌','violet');if(G.turn===0||G.stage==='R1'||G.stage==='R2')setPrompt(false);render();break;
    case'reveal':case'bao':
      if(NET==='guest'){if(G.locked||(A==='reveal'&&G.pick==null))break;send(A==='bao'?{t:'reveal',bao:true}:{t:'reveal',pick:G.pick});localLocked=true;G.locked=true;G.msg='等其他人选好…';render();break}
      confirmReveal(A==='bao');break;
    case'host':S.nick=clean($('#nick').value);saveS();hostRoom();break;
    case'joinOpen':S.nick=clean($('#nick').value);saveS();
      $('#roomBox').innerHTML=`<h2>加入房间</h2><input class="field" id="joinCode" inputmode="numeric" maxlength="4" placeholder="4 位房间号" autocomplete="off"><div class="row2">${B('取消','plum','closeRoom')}${B('加入','teal wide','joinGo')}</div>`;
      $('#room').classList.add('on');setTimeout(()=>{const el=$('#joinCode');if(el)el.focus()},50);break;
    case'joinGo':{const c=($('#joinCode').value||'').replace(/\D/g,'');if(c.length!==4){$('#joinCode').focus();break}joinRoom(c,clean($('#nick').value)||'玩家');break}
    case'netStart':startNetGame();break;
    case'closeRoom':$('#room').classList.remove('on');break;
    case'leave':leaveNet();openLobby();break;
    case'skip':G.skip=true;render();break;
    case'next':newHand();break;
    case'restart':case'start':leaveNet(true);startSession();break;
    case'resume':$('#lobby').classList.remove('on');break;
    case'lobby':openLobby();break;
    case'closeRules':$('#rules').classList.remove('on');break;
  }
});
$('#scrim').addEventListener('click',hideSheet);
$('#rng').addEventListener('input',rngSync);
app.addEventListener('pointerdown',e=>{ac();if(e.target.closest('.btn,.chip-btn,.mode,.seg button,.opt,.card.pickable'))sfx('click')},{passive:true});
$('#btnSnd').addEventListener('click',()=>{AU.on=!AU.on;S.sound=AU.on;saveS();syncSnd();if(AU.on)sfx('chip')});
syncSnd();fxInit();
$('#btnMode').addEventListener('click',openLobby);
$('#btnRules').addEventListener('click',()=>{$('#rulesBox').innerHTML=rulesHTML();$('#rules').classList.add('on')});
$('#btnEq').addEventListener('click',e=>{showEq=!showEq;e.currentTarget.setAttribute('aria-pressed',showEq);render()});
$('#steps').innerHTML=STEPS.map(s=>`<li><i></i>${s}</li>`).join('');

/* ---------- pixel plasma background ---------- */
(function bg(){
  const cv=$('#bg'),cx=cv.getContext('2d'),W=64,H=138;cv.width=W;cv.height=H;
  const img=cx.createImageData(W,H),d=img.data;
  const PAL=[[24,18,44],[33,24,60],[44,31,80],[56,38,98],[38,62,104],[30,92,108]];
  const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  function frame(t){
    let k=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const dx=x-W/2,dy=y-H*.46,r=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx);
      let v=Math.sin(x*.11+t*.7)+Math.sin(y*.07-t*.5)+Math.sin(ang*3+r*.16-t*.9)+Math.sin(r*.09-t*.6);
      v=(v+4)/8;v=v*.85+.15*(1-Math.min(r/80,1));
      v+=(BAY[(y&3)*4+(x&3)]/16-.5)*.16;
      const c=PAL[Math.max(0,Math.min(PAL.length-1,Math.floor(v*PAL.length)))];
      d[k++]=c[0];d[k++]=c[1];d[k++]=c[2];d[k++]=255;
    }
    cx.putImageData(img,0,0);
  }
  if(reduce){frame(1);return}
  let last=0;(function loop(ts){if(ts-last>60){frame(ts/1600);last=ts}requestAnimationFrame(loop)})(0);
})();

openLobby();
})();
</script>
